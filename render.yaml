services:
  - type: web
    name: anand-rathi-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anand-rathi-db
          property: connectionString
      - key: ENV
        value: production

databases:
  - name: anand-rathi-db
    databaseName: anandrathi_workstation
    user: anandrathi_user
    plan: free

